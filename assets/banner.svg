<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <!-- Vibrant Gradient for Title / Accents -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Node Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .network-line { stroke: rgba(99, 102, 241, 0.35); stroke-width: 1.5; stroke-dasharray: 6 4; }
      
      /* Subtle pulse & dynamic orbital animations in background */
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes floatRing {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 100; }
      }
      @keyframes orbitFloat {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      .node-pulse-1 { animation: pulseNode 4s ease-in-out infinite; transform-origin: 180px 80px; }
      .node-pulse-2 { animation: pulseNode 3.5s ease-in-out infinite 1s; transform-origin: 1020px 100px; }
      .node-pulse-3 { animation: pulseNode 4.5s ease-in-out infinite 0.5s; transform-origin: 150px 270px; }
      .node-pulse-4 { animation: pulseNode 3s ease-in-out infinite 1.5s; transform-origin: 1050px 260px; }
      .animated-dash { stroke-dasharray: 8 6; animation: floatRing 20s linear infinite; }
      .floating-card { animation: orbitFloat 6s ease-in-out infinite; }
      .floating-card-delay { animation: orbitFloat 7s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Tech Grid -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Network Constellation / Ecosystem Graph Lines -->
  <g class="network-line animated-dash">
    <path d="M 180 80 Q 280 40 400 90 T 600 70 T 800 90 T 1020 100" fill="none" />
    <path d="M 150 270 Q 300 320 600 290 T 900 310 T 1050 260" fill="none" />
    <path d="M 180 80 L 150 270" fill="none" />
    <path d="M 1020 100 L 1050 260" fill="none" />
  </g>

  <!-- Animated Glowing Background Nodes -->
  <g class="node-pulse-1" filter="url(#glow)">
    <circle cx="180" cy="80" r="10" fill="#38bdf8" />
    <circle cx="180" cy="80" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  </g>
  <g class="node-pulse-2" filter="url(#glow)">
    <circle cx="1020" cy="100" r="10" fill="#818cf8" />
    <circle cx="1020" cy="100" r="24" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />
  </g>
  <g class="node-pulse-3" filter="url(#glow)">
    <circle cx="150" cy="270" r="9" fill="#c084fc" />
    <circle cx="150" cy="270" r="20" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.4" />
  </g>
  <g class="node-pulse-4" filter="url(#glow)">
    <circle cx="1050" cy="260" r="9" fill="#34d399" />
    <circle cx="1050" cy="260" r="20" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Decorative Orbiting Badges/Cards in Outer Areas -->
  <g class="floating-card" opacity="0.85">
    <rect x="70" y="150" width="140" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="140" y="176" fill="#93c5fd" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">⚡ PRM &amp; Co-Sell</text>
  </g>
  <g class="floating-card-delay" opacity="0.85">
    <rect x="990" y="165" width="140" height="42" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="1060" y="191" fill="#e9d5ff" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">🌐 Cross-Cloud Hub</text>
  </g>

  <!-- Foreground Main Content: Remains fully crisp and centered -->
  <g id="foreground-content">
    <!-- Tag Pill -->
    <rect x="470" y="42" width="260" height="28" rx="14" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2" />
    <text x="600" y="61" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
      Partner Ecosystem Orchestration
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" text-anchor="middle">
      PRM, Account Mapping, Co-Selling &amp; Channel Ecosystem Platforms
    </text>

    <!-- Description Details -->
    <text x="600" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" text-anchor="middle">
      Enterprise SaaS Market Intelligence &amp; Open-Source Alternatives
    </text>

    <!-- Bottom Feature Badges -->
    <g transform="translate(320, 268)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="170" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="85" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🤝 Account Mapping</text>

      <!-- Badge 2 -->
      <rect x="190" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="280" y="21" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Channel &amp; Referral</text>

      <!-- Badge 3 -->
      <rect x="390" y="0" width="170" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="475" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⭐ Open Source PRM</text>
    </g>
  </g>
</svg>
